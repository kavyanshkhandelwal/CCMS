{% extends 'base.html' %}{% block body %}
<div class="hero"><h1>Create account.</h1><p class="sub">Students and faculty can register in seconds.</p></div>
<form method="post" class="card"><label>Full name</label><input type="text" name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required minlength="6">
<label>I am a</label><select name="role"><option value="student">Student</option><option value="staff">Faculty / Staff</option></select>
<button>Create account</button><p class="small">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form>{% endblock %}
