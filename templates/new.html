{% extends 'base.html' %}{% block body %}
<div class="hero"><h1>Lodge a complaint.</h1><p class="sub">We will route it to the right department automatically.</p></div>
<form method="post" enctype="multipart/form-data" class="card wide">
<label>Category</label><select name="category">{% for c in cats %}<option>{{ c }}</option>{% endfor %}</select>
<label>Subject</label><input type="text" name="title" maxlength="150" required>
<label>Description</label><textarea name="description" required></textarea>
<label>Photo proof (optional, max 2 MB)</label><input type="file" name="photo" accept="image/*">
<button>Submit complaint</button></form>{% endblock %}
